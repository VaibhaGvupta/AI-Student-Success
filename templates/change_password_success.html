<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Password Changed - AI Student Success Platform</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #f8fafc
                );

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 430px;

            background: white;

            border-radius: 16px;

            padding: 35px;

            text-align: center;

            box-shadow:
                0 15px 40px
                rgba(15, 23, 42, 0.10);

            border: 1px solid #e2e8f0;
        }

        .icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #dcfce7;

            color: #15803d;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 32px;
        }

        h1 {
            margin: 0 0 12px;

            color: #0f172a;

            font-size: 25px;
        }

        p {
            color: #64748b;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        .button {
            display: block;

            width: 100%;

            padding: 13px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            border-radius: 9px;

            font-weight: 700;

            transition: background 0.2s;
        }

        .button:hover {
            background: #1d4ed8;
        }

    </style>

</head>


<body>

    <div class="card">

        <div class="icon">
            ✓
        </div>

        <h1>
            Password Changed Successfully!
        </h1>

        <p>
            Your account password has been changed
            successfully.
        </p>

        <a
            href="{{ url_for('dashboard') }}"
            class="button"
        >
            Back to Dashboard
        </a>

    </div>

</body>

</html>

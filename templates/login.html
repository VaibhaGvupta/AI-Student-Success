<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - AI Student Success Platform</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #f8fafc
                );

            color: #172033;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h1 {
            margin: 0;

            font-size: 28px;
            font-weight: 800;

            color: #1e3a8a;
        }

        .brand p {
            margin-top: 8px;

            color: #64748b;

            font-size: 14px;
        }

        .card {
            background: white;

            border-radius: 16px;

            padding: 32px;

            box-shadow:
                0 15px 40px
                rgba(15, 23, 42, 0.10);

            border: 1px solid #e2e8f0;
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 8px;

            font-size: 24px;

            color: #0f172a;
        }

        .subtitle {
            margin-top: 0;
            margin-bottom: 25px;

            color: #64748b;

            font-size: 14px;

            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            font-size: 14px;

            color: #334155;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.10);
        }

        .login-button {
            width: 100%;

            border: none;

            border-radius: 9px;

            padding: 13px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.2s;
        }

        .login-button:hover {
            background: #1d4ed8;

            transform: translateY(-1px);
        }

        .forgot-password {
            display: block;

            text-align: right;

            margin-top: 12px;

            color: #2563eb;

            font-size: 14px;

            font-weight: 600;

            text-decoration: none;
        }

        .forgot-password:hover {
            text-decoration: underline;
        }

        .links {
            text-align: center;

            margin-top: 22px;

            padding-top: 20px;

            border-top: 1px solid #e2e8f0;
        }

        .links p {
            margin: 0 0 10px;

            color: #64748b;

            font-size: 14px;
        }

        .links a {
            color: #2563eb;

            font-size: 14px;

            font-weight: 600;

            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;

            text-align: center;

            margin-top: 18px;

            color: #64748b;

            text-decoration: none;

            font-size: 14px;
        }

        .back-home:hover {
            color: #2563eb;
        }

        .error-alert {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 12px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: shake 0.4s ease-in-out;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.08);
        }

        .error-icon {
            font-size: 18px;
            flex-shrink: 0;
        }

        .error-text {
            flex: 1;
            font-weight: 500;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }

        @media (max-width: 480px) {

            .card {
                padding: 25px 20px;
            }

            .brand h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <!-- BRAND -->

        <div class="brand">

            <h1>
                AI Student Success Platform
            </h1>

            <p>
                Personalized academic insights and support
            </p>

        </div>


        <!-- LOGIN CARD -->

        <div class="card">

            <h2>
                Welcome Back 👋
            </h2>

            <p class="subtitle">
                Login to access your student dashboard.
            </p>


            <!-- ERROR MESSAGE -->
            {% if error %}
            <div class="error-alert">
                <span class="error-icon">⚠️</span>
                <span class="error-text">{{ error }}</span>
            </div>
            {% endif %}


            <!-- LOGIN FORM -->

            <form
                method="POST"
                action="{{ url_for('login') }}"
            >

                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        value="{{ email|default('') }}"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <!-- FORGOT PASSWORD -->

            <a
                href="{{ url_for('forgot_password') }}"
                class="forgot-password"
            >
                Forgot Password?
            </a>


            <!-- CREATE ACCOUNT -->

            <div class="links">

                <p>
                    Don't have an account?
                </p>

                <a href="{{ url_for('create_account') }}">
                    Create Account
                </a>

            </div>

        </div>


        <!-- HOME -->

        <a
            href="{{ url_for('home') }}"
            class="back-home"
        >
            ← Back to Home
        </a>

    </div>

</body>

</html>

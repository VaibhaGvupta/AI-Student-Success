<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Subject Already Exists - AI Student Success Platform</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eff6ff, #f8fafc);
            color: #172033;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: white;
            border-radius: 16px;
            padding: 35px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.10);
            border: 1px solid #e2e8f0;
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #fef2f2;
            color: #ef4444;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        h1 {
            margin: 0 0 12px;
            color: #0f172a;
            font-size: 24px;
        }

        p {
            color: #64748b;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .subject-badge {
            display: inline-block;
            background: #eff6ff;
            color: #1e40af;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .button-primary {
            display: block;
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 9px;
            font-weight: bold;
            font-size: 15px;
            transition: background 0.2s;
        }

        .button-primary:hover {
            background: #1d4ed8;
        }

        .button-secondary {
            display: block;
            width: 100%;
            padding: 13px;
            background: #f1f5f9;
            color: #334155;
            text-decoration: none;
            border-radius: 9px;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.2s;
        }

        .button-secondary:hover {
            background: #e2e8f0;
        }

    </style>

</head>

<body>

    <div class="card">

        <div class="icon">
            ⚠️
        </div>

        <h1>
            Subject Already Exists
        </h1>

        <div class="subject-badge">
            {{ subject }} (Semester {{ semester }})
        </div>

        <p>
            You have already recorded academic data for <strong>{{ subject }}</strong> in Semester {{ semester }}.
            You can either edit the existing record or add a different subject.
        </p>

        <div class="buttons">

            <a
                href="{{ url_for('add_academic', semester=semester) }}"
                class="button-primary"
            >
                ➕ Add Different Subject
            </a>

            <a
                href="{{ url_for('dashboard', semester=semester) }}"
                class="button-secondary"
            >
                ← Back to Dashboard
            </a>

        </div>

    </div>

</body>

</html>

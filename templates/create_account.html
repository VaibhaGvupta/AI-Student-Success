<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - AI Student Success</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .register-box {

            background: white;

            width: 380px;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.1);

            text-align: center;
        }

        .logo {

            font-size: 45px;

            margin-bottom: 10px;
        }

        h1 {

            margin: 0;

            color: #222;
        }

        .subtitle {

            color: #777;

            margin-bottom: 30px;
        }

        input {

            width: 100%;

            padding: 13px;

            margin: 10px 0;

            border: 1px solid #ddd;

            border-radius: 8px;

            box-sizing: border-box;

            font-size: 15px;
        }

        button {

            width: 100%;

            padding: 13px;

            margin-top: 15px;

            border: none;

            border-radius: 8px;

            background: #4f46e5;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {

            background: #4338ca;
        }

        .login-link {

            margin-top: 20px;

            font-size: 14px;

            color: #666;
        }

        .login-link a {

            color: #4f46e5;

            text-decoration: none;

            font-weight: bold;
        }

        .login-link a:hover {

            text-decoration: underline;
        }

        .error-alert {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 13.5px;
            text-align: left;
            line-height: 1.4;
            display: flex;
            align-items: center;
            gap: 8px;
        }

    </style>

</head>


<body>


    <div class="register-box">


        <div class="logo">
            🎓
        </div>


        <h1>
            Create Account
        </h1>


        <p class="subtitle">
            Join AI Student Success
        </p>


        <!-- ERROR MESSAGE -->
        {% if error %}
        <div class="error-alert">
            <span>⚠️</span>
            <span>{{ error }}</span>
        </div>
        {% endif %}


        <!-- =========================
             CREATE ACCOUNT FORM
        ========================== -->

        <form method="POST" action="/register">


            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                value="{{ name|default('') }}"
                required
            >


            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                value="{{ email|default('') }}"
                required
            >


            <input
                type="password"
                name="password"
                placeholder="Create a password (min. 6 characters)"
                minlength="6"
                required
            >


            <input
                type="password"
                name="confirm_password"
                placeholder="Confirm your password"
                required
            >


            <button type="submit">
                Create Account
            </button>


        </form>


        <!-- =========================
             BACK TO LOGIN
        ========================== -->

        <div class="login-link">

            Already have an account?

            <a href="/">
                Login
            </a>

        </div>


    </div>


</body>
</html>

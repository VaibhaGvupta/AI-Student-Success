<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password - AI Student Success Platform</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eff6ff,
                    #f8fafc
                );

            color: #172033;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 430px;
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h1 {
            margin: 0;

            font-size: 28px;
            font-weight: 800;

            color: #1e3a8a;
        }

        .brand p {
            margin-top: 8px;

            color: #64748b;

            font-size: 14px;
        }

        .card {
            background: white;

            border-radius: 16px;

            padding: 32px;

            box-shadow:
                0 15px 40px
                rgba(15, 23, 42, 0.10);

            border: 1px solid #e2e8f0;
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 8px;

            font-size: 24px;

            color: #0f172a;
        }

        .subtitle {
            margin-top: 0;
            margin-bottom: 25px;

            color: #64748b;

            font-size: 14px;

            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;

            margin-bottom: 7px;

            font-weight: 600;

            font-size: 14px;

            color: #334155;
        }

        .form-group input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cbd5e1;

            border-radius: 9px;

            font-size: 15px;

            outline: none;

            transition:
                border-color 0.2s,
                box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;

            box-shadow:
                0 0 0 3px
                rgba(37, 99, 235, 0.10);
        }

        .reset-button {
            width: 100%;

            border: none;

            border-radius: 9px;

            padding: 13px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.2s;
        }

        .reset-button:hover {
            background: #1d4ed8;

            transform: translateY(-1px);
        }

        .error {
            background: #fef2f2;

            border: 1px solid #fecaca;

            color: #b91c1c;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 14px;

            line-height: 1.5;
        }

        .password-info {
            background: #eff6ff;

            border: 1px solid #bfdbfe;

            color: #1e40af;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            font-size: 13px;

            line-height: 1.5;
        }

        .links {
            text-align: center;

            margin-top: 22px;

            padding-top: 20px;

            border-top: 1px solid #e2e8f0;
        }

        .links a {
            color: #2563eb;

            font-size: 14px;

            font-weight: 600;

            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {

            .card {
                padding: 25px 20px;
            }

            .brand h1 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <!-- BRAND -->

        <div class="brand">

            <h1>
                AI Student Success Platform
            </h1>

            <p>
                Personalized academic insights and support
            </p>

        </div>


        <!-- RESET PASSWORD CARD -->

        <div class="card">

            <h2>
                Create New Password
            </h2>

            <p class="subtitle">
                Enter a new password for your account.
            </p>


            <!-- ERROR -->

            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            <!-- PASSWORD INFORMATION -->

            <div class="password-info">
                Your password should contain at least
                6 characters.
            </div>


            <!-- RESET FORM -->

            <form
                method="POST"
                action="{{ url_for('reset_password') }}"
            >

                <!-- NEW PASSWORD -->

                <div class="form-group">

                    <label for="new_password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="new_password"
                        name="new_password"
                        placeholder="Enter new password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirm_password">
                        Confirm New Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm new password"
                        minlength="6"
                        required
                    >

                </div>


                <!-- BUTTON -->

                <button
                    type="submit"
                    class="reset-button"
                >
                    Reset Password
                </button>

            </form>


            <!-- LOGIN -->

            <div class="links">

                <a href="{{ url_for('login') }}">
                    ← Back to Login
                </a>

            </div>

        </div>

    </div>

</body>

</html>

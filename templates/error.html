<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ title }}</title>


    <style>

        body {

            font-family: Arial, sans-serif;

            background: #f4f6f8;

            margin: 0;

            padding: 0;
        }


        .navbar {

            background: #1f2937;

            color: white;

            padding: 18px 30px;

            text-align: center;
        }


        .navbar h2 {

            margin: 0;
        }


        .container {

            width: 90%;

            max-width: 550px;

            margin: 100px auto;

        }


        .error-box {

            background: white;

            padding: 35px;

            border-radius: 10px;

            text-align: center;

            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }


        .icon {

            font-size: 50px;

            margin-bottom: 15px;
        }


        h1 {

            margin-top: 0;

            color: #dc2626;
        }


        p {

            font-size: 17px;

            line-height: 1.6;

            color: #555;
        }


        .back-button {

            display: inline-block;

            margin-top: 20px;

            padding: 12px 22px;

            background: #2563eb;

            color: white;

            text-decoration: none;

            border-radius: 6px;

            font-size: 16px;
        }


        .back-button:hover {

            background: #1d4ed8;
        }

    </style>

</head>


<body>


    <div class="navbar">

        <h2>
            🎓 AI Student Success Platform
        </h2>

    </div>


    <div class="container">


        <div class="error-box">


            <div class="icon">
                ⚠️
            </div>


            <h1>
                {{ title }}
            </h1>


            <p>
                {{ message }}
            </p>


            <a
                href="/dashboard?semester={{ semester }}"
                class="back-button"
            >
                ← Back to Semester {{ semester }} Dashboard
            </a>


        </div>


    </div>


</body>

</html>
